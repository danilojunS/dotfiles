# Shared herdr config. build-config.sh merges ~/.config/herdr/config.local.toml
# (per-machine overrides: theme, etc.) on top of it into ~/.config/herdr/config.toml,
# on install and on every `herdr` through the wrapper in shell/dj.sh.

onboarding = false

[keys]
# ctrl+a outside tmux. Inside tmux (which owns ctrl+a) the herdr() wrapper in
# shell/dj.sh drops it back to ctrl+b.
prefix = "ctrl+a"

# tmux-style splits (matches ~/.tmux.conf: prefix+| side by side, prefix+- stacked)
split_vertical = ["prefix+|", "prefix+v"]
split_horizontal = "prefix+minus"

# prefix+( / prefix+) cycle workspaces, like tmux's switch-client -p/-n
# (prefix+n/p already cycle tabs)
previous_workspace = "prefix+("
next_workspace = "prefix+)"

# ctrl+p / ctrl+n move through the workspace list (prefix+w), next to the
# arrows. j/k can't: navigate mode already uses hjkl to focus panes.
navigate_workspace_up = ["up", "ctrl+p"]
navigate_workspace_down = ["down", "ctrl+n"]

# prefix+\ shows/hides the sidebar, next to prefix+| for splits; herdr's
# prefix+b stays too
toggle_sidebar = ["prefix+b", 'prefix+\']

# ctrl+hjkl moves between panes without the prefix
focus_pane_left = ["ctrl+h", "prefix+h"]
focus_pane_down = ["ctrl+j", "prefix+j"]
focus_pane_up = ["ctrl+k", "prefix+k"]
focus_pane_right = ["ctrl+l", "prefix+l"]

# prefix+x asks before closing, like tmux's kill-pane (see [[keys.command]]
# below), so the built-in instant close gives the key up.
close_pane = []

[theme]
name = "kanagawa"
auto_switch = false

[ui]
# Right end of the tab row, like tmux2k's status-right in ~/.tmux.conf.
# Plain text only: herdr drops colour codes from command output.
tab_bar_right = [
  # The OS as a Nerd Font glyph (nf-fa-apple / nf-fa-linux) in place of the
  # hostname. Runs on the server, so over --remote it names the remote machine.
  { type = "command", command = 'case $(uname) in Darwin) printf "\357\205\271";; Linux) printf "\357\205\274";; *) uname;; esac', interval_seconds = 86400 },
  { type = "zoom" },
  { type = "command", command = "~/.dotfiles/shell/_tools/herdr/status.sh", interval_seconds = 5, timeout_seconds = 2 },
  { type = "datetime", format = "%d/%m %H:%M" },
]
# herdr's default is a bare space. Two spaces and no mark: the icons already
# start each part. status.sh puts the same gap between its own parts.
tab_bar_right_separator = "  "

[ui.toast]
delivery = "system"

# Every agent in one space reads ".dotfiles · 2 / claude" by default. Name the
# agent up top in its own colour, and put its session title on the second line.
# herdr has no per-agent icon, and an override replaces the whole layout, so
# each agent repeats it with only the colour changed.
[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", { token = "agent", fg = "#d97757" }, "workspace", "tab"],
  ["terminal_title_stripped"],
]
codex = [
  ["state_icon", { token = "agent", fg = "#10a37f" }, "workspace", "tab"],
  ["terminal_title_stripped"],
]
grok = [
  ["state_icon", { token = "agent", fg = "#b8b4d0" }, "workspace", "tab"],
  ["terminal_title_stripped"],
]
opencode = [
  ["state_icon", { token = "agent", fg = "#7fb4ca" }, "workspace", "tab"],
  ["terminal_title_stripped"],
]

# tmux-style `kill-pane? (y/n)` for prefix+x. Any key but y cancels.
[[keys.command]]
key = "prefix+x"
type = "popup"
description = "close pane (confirm)"
width = 30
height = 3
command = 'printf "close pane? (y/n) "; stty -icanon -echo; c=$(dd bs=1 count=1 2>/dev/null); [ "$c" = y ] && "$HERDR_BIN_PATH" pane close "$HERDR_ACTIVE_PANE_ID"; exit 0'

# prefix+a sends one command to every pane in the tab, like tmux's
# synchronize-panes. See send-all.sh.
[[keys.command]]
key = "prefix+a"
type = "popup"
description = "send to all panes"
width = 60
height = 3
command = '"$HOME/.dotfiles/shell/_tools/herdr/send-all.sh"'

# Shared herdr config. build-config.sh merges ~/.config/herdr/config.local.toml
# (per-machine overrides: theme, etc.) on top of it into ~/.config/herdr/config.toml,
# on install and on every `herdr` through the wrapper in shell/dj.sh.

onboarding = false

[keys]
# ctrl+a outside tmux. Inside tmux (which owns ctrl+a) the herdr() wrapper in
# shell/dj.sh drops it back to ctrl+b.
prefix = "ctrl+a"

# tmux-style splits (matches ~/.tmux.conf: prefix+| side by side, prefix+- stacked)
split_vertical = ["prefix+|", "prefix+v"]
split_horizontal = "prefix+minus"

# ctrl+hjkl moves between panes without the prefix
focus_pane_left = ["ctrl+h", "prefix+h"]
focus_pane_down = ["ctrl+j", "prefix+j"]
focus_pane_up = ["ctrl+k", "prefix+k"]
focus_pane_right = ["ctrl+l", "prefix+l"]

# prefix+x asks before closing, like tmux's kill-pane (see [[keys.command]]
# below), so the built-in instant close gives the key up.
close_pane = []

[theme]
name = "kanagawa"
auto_switch = false

[ui.toast]
delivery = "system"

# Every agent in one space reads ".dotfiles · 2 / claude" by default. Name the
# agent up top in its own colour, and put its session title on the second line.
# herdr has no per-agent icon, and an override replaces the whole layout, so
# each agent repeats it with only the colour changed.
[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", { token = "agent", fg = "#d97757" }, "workspace", "tab"],
  ["terminal_title_stripped"],
]
codex = [
  ["state_icon", { token = "agent", fg = "#10a37f" }, "workspace", "tab"],
  ["terminal_title_stripped"],
]
grok = [
  ["state_icon", { token = "agent", fg = "#b8b4d0" }, "workspace", "tab"],
  ["terminal_title_stripped"],
]
opencode = [
  ["state_icon", { token = "agent", fg = "#7fb4ca" }, "workspace", "tab"],
  ["terminal_title_stripped"],
]

# tmux-style `kill-pane? (y/n)` for prefix+x. Any key but y cancels.
[[keys.command]]
key = "prefix+x"
type = "popup"
description = "close pane (confirm)"
width = 30
height = 3
command = 'printf "close pane? (y/n) "; stty -icanon -echo; c=$(dd bs=1 count=1 2>/dev/null); [ "$c" = y ] && "$HERDR_BIN_PATH" pane close "$HERDR_ACTIVE_PANE_ID"; exit 0'
